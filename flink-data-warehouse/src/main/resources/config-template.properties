# =============================================================================
# Kafka 配置模板
# 复制为 config.properties 并填入真实值
# config.properties 已被 .gitignore 排除，不会提交至仓库
# =============================================================================
kafka.bootstrap.servers=<KAFKA_SERVERS>
kafka.topic.products=ods_products_data
kafka.topic.orders=ods_orders_data
kafka.group.id=flink-dw-consumer

# =============================================================================
# PostgreSQL 配置模板
# =============================================================================
db.jdbc.url=jdbc:postgresql://<DB_HOST>:5432/DataWarehouse
db.user=<DB_USER>
db.password=<DB_PASSWORD>

# =============================================================================
# Flink Checkpoint 配置
# =============================================================================
checkpoint.interval.ms=60000
checkpoint.dir=file:///tmp/flink-checkpoints
