# =============================================================================
# Spring Boot 应用配置模板
# 复制为 application.yml 并填入真实值
# application.yml 已被 .gitignore 排除，不会提交至仓库
# =============================================================================
server:
  port: 8080

spring:
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  datasource:
    url: jdbc:postgresql://<DB_HOST>:5432/DataWarehouse
    username: <DB_USER>
    password: <DB_PASSWORD>
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 10000

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.dw.vis.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.dw.vis: DEBUG
    org.springframework: INFO
