# =============================================================================
# Spring Boot 应用配置模板
# 复制为 application.yml 并填入真实值（不会被 git 提交）
# =============================================================================
server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: always
    include-exception: true

spring:
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
  datasource:
    url: jdbc:postgresql://<DB_HOST>:5432/DataWarehouse
    username: <DB_USER>
    password: <DB_PASSWORD>
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      connection-timeout: 10000

mybatis-plus:
  type-aliases-package: com.dw.vis.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.dw.vis: DEBUG
    org.springframework: INFO
