<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>商品库</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{display:flex;font-family:'Microsoft YaHei',sans-serif}.sidebar{width:200px;min-height:100vh;background:#1a1a2e;color:#eee;flex-shrink:0}.sidebar h4{padding:20px 16px 10px;color:#e94560}.sidebar a{display:block;padding:12px 20px;color:#ccc;text-decoration:none;border-left:3px solid transparent;font-size:14px}.sidebar a:hover,.sidebar a.active{background:#16213e;color:#fff;border-left-color:#e94560}.main{flex:1;padding:20px 30px;background:#f5f6fa;min-height:100vh}.card{border:none;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.06);background:#fff;padding:15px;margin-bottom:20px}table{width:100%;border-collapse:collapse}th,td{padding:8px 12px;border-bottom:1px solid #eee;font-size:13px;text-align:left}th{background:#f8f9fa;font-weight:bold}.pagination{display:flex;gap:10px;align-items:center;margin-top:15px}.pagination button{padding:6px 12px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer}.pagination button:hover{background:#e94560;color:#fff;border-color:#e94560}.pagination button.active{background:#e94560;color:#fff}.search-bar{display:flex;align-items:center;gap:10px;margin-bottom:20px}.search-bar select{padding:6px 12px;border:1px solid #ddd;border-radius:4px;font-size:14px}.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:#16c79a;color:#fff}</style></head>
<body>
<div class="sidebar" id="sidebar"></div>
<div class="main">
<h5 style="margin-bottom:15px">商品库 (dim_goods_info) <span id="updateTime" style="font-size:12px;color:#999;margin-left:10px"></span></h5>
<div class="search-bar">
<strong>品类:</strong>
<select id="categoryFilter" onchange="loadPage(1)"><option value="">全部</option></select>
<span style="margin-left:20px;color:#888">共 <span id="totalCount">-</span> 个SKU</span>
</div>
<div class="card">
<table><thead><tr><th>SKU ID</th><th>SPU名称</th><th>品牌</th><th>品类</th><th>价格</th><th>状态</th></tr></thead><tbody id="goodsBody"></tbody></table>
<div class="pagination" id="pager"></div>
</div>
</div>
<script>
document.getElementById('sidebar').innerHTML='<h4>DW可视化</h4>'+['仪表盘','品类营收','销售趋势','用户价值','商品排行','区域销售','商品库'].map(function(n,i){var p=['/','/category-revenue','/daily-sales-trend','/user-value','/product-ranking','/regional-sales','/goods-info'][i];return'<a href="'+p+'"'+(location.pathname===p?' class="active"':'')+'>'+n+'</a>'}).join('');

var currentPage=1,pageSize=20,category='';
function loadPage(p){
  currentPage=p;
  document.getElementById('updateTime').innerText='更新: '+new Date().toLocaleTimeString();
  var url='/api/ads/goods-info?page='+p+'&size='+pageSize+(category?'&category='+encodeURIComponent(category):'');
  fetch(url).then(function(r){return r.json()}).then(function(d){
    document.getElementById('totalCount').innerText=d.total;
    var h=''; d.data.forEach(function(x){
      h+='<tr><td style="font-size:11px;color:#666">'+x.skuId+'</td><td>'+x.spuName+'</td><td>'+x.brandName+'</td><td>'+x.firstCategoryName+(x.secondCategoryName?'/'+x.secondCategoryName:'')+'</td><td style="color:#e94560;font-weight:bold">'+(x.skuPrice||0).toFixed(2)+'</td><td><span class="badge">'+(x.isActive===1?'在售':'下架')+'</span></td></tr>';
    });
    document.getElementById('goodsBody').innerHTML=h;
    var totalPages=Math.ceil(d.total/pageSize),pg='';
    for(var i=1;i<=totalPages;i++) pg+='<button class="'+(i===currentPage?'active':'')+'" onclick="loadPage('+i+')">'+i+'</button>';
    document.getElementById('pager').innerHTML=pg;
    // init category dropdown once
    if(document.getElementById('categoryFilter').options.length<=1){
      var sel=document.getElementById('categoryFilter');
      d.categories.forEach(function(c){var o=document.createElement('option');o.value=c;o.text=c;sel.appendChild(o)});
    }
  });
}
document.getElementById('categoryFilter').addEventListener('change',function(){category=this.value;loadPage(1)});
loadPage(1);
setInterval(function(){loadPage(currentPage)},30000);
</script>
</body>
</html>
