<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>用户价值</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{display:flex;font-family:'Microsoft YaHei',sans-serif;background:#f0f2f5}
.sidebar{width:200px;min-height:100vh;background:linear-gradient(180deg,#1a1a2e 0%,#16213e 100%);color:#eee;flex-shrink:0;position:sticky;top:0}
.sidebar h4{padding:24px 20px 16px;color:#e94560;font-size:16px;letter-spacing:1px}
.sidebar a{display:flex;align-items:center;padding:14px 20px;color:#b0b0c0;text-decoration:none;border-left:3px solid transparent;font-size:14px;transition:all .2s}
.sidebar a:hover,.sidebar a.active{background:rgba(233,69,96,.1);color:#fff;border-left-color:#e94560}
.main{flex:1;padding:24px 30px;min-height:100vh}
.card{border:none;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.06);background:#fff;padding:20px}
.card-header{font-weight:bold;padding:0 0 10px;font-size:15px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:#f8f9fc}
th{padding:12px 14px;font-weight:600;color:#555;text-align:left;border-bottom:2px solid #eee;white-space:nowrap;font-size:12px}
td{padding:11px 14px;color:#333;border-bottom:1px solid #f0f0f0}
tbody tr:hover{background:#fef0f2}
.badge-tier{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500}
.badge-high{background:#fde8ec;color:#e94560}
.amount{color:#e94560;font-weight:600}
.muted{color:#999;font-size:12px}
.date-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px}
.date-bar input[type=date]{padding:4px 8px;border:1px solid #ddd;border-radius:4px;font-size:13px}
.date-bar button{padding:5px 14px;background:#e94560;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:13px}
.date-bar button:hover{background:#c73d52}
.scatter-loading{display:flex;align-items:center;justify-content:center;height:300px;color:#999;font-size:14px}
.scatter-loading .spinner{width:20px;height:20px;border:3px solid #e0e0e0;border-top-color:#e94560;border-radius:50%;animation:spin .6s linear infinite;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}
</style></head>
<body>
<div class="sidebar">
<h4>DW可视化</h4>
<a href="/">仪表盘</a>
<a href="/category-revenue">品类营收</a>
<a href="/daily-sales-trend">销售趋势</a>
<a href="/user-value" class="active">用户价值</a>
<a href="/product-ranking">商品排行</a>
<a href="/regional-sales">区域销售</a>
<a href="/goods-info">商品库</a>
</div>
<div class="main">
<h5 style="margin-bottom:20px">用户价值分析 (RFM) <span id="updateTime" style="font-size:12px;color:#999;margin-left:10px"></span></h5>
<div style="display:flex;gap:15px">
<div class="card" style="flex:1"><div class="card-header">价值分层</div><div id="chartPie" style="height:320px"></div></div>
<div class="card" style="flex:2">
<div class="card-header">RFM散点图 (每天Top10高价值用户)</div>
<div class="date-bar">
<label>时间范围:</label>
<input type="date" id="dateFrom"><span>~</span><input type="date" id="dateTo">
<button onclick="doFilterScatter()">筛选</button>
<span id="scatterInfo" style="color:#999"></span>
</div>
<div id="chartScatter" style="height:300px"></div>
<div id="scatterLoading" class="scatter-loading"><span class="spinner"></span>数据加载中...</div>
</div>
</div>
<div class="card" style="margin-top:15px">
<div class="card-header">高价值用户明细 (累计消费≥1万元) <span style="font-weight:400;font-size:12px;color:#999;margin-left:8px">Top20 按消费金额降序</span></div>
<div class="table-wrap">
<table><thead><tr><th>#</th><th>手机号</th><th>用户名</th><th>最近购买</th><th>购买频次</th><th>累计消费(元)</th><th>客单价(元)</th><th>等级</th></tr></thead><tbody id="topUserBody"><tr><td colspan="8" style="text-align:center;padding:30px;color:#999">加载中...</td></tr></tbody></table>
</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>
var allUserData = null;

// 初始化默认日期范围：近30天
(function initDate(){
    var t = new Date();
    document.getElementById('dateTo').value = t.toISOString().slice(0,10);
    t.setDate(t.getDate() - 30);
    document.getElementById('dateFrom').value = t.toISOString().slice(0,10);
})();

function doFilterScatter(){
    var sc = echarts.getInstanceByDom(document.getElementById('chartScatter'));
    if(!sc) sc = echarts.init(document.getElementById('chartScatter'));
    if(!allUserData){ return; }
    var ld = document.getElementById('scatterLoading');
    var ch = document.getElementById('chartScatter');
    ld.style.display = 'flex';
    ch.style.display = 'none';
    setTimeout(function(){
        var from = document.getElementById('dateFrom').value;
        var to = document.getElementById('dateTo').value;
        // 按天分组，每天独立取 Top10
        var dayMap = {};
        allUserData.forEach(function(x){
            var d = x.lastOrderDate;
            if(!d) return;
            if(from && d < from) return;
            if(to && d > to) return;
            if(!dayMap[d]) dayMap[d] = [];
            dayMap[d].push(x);
        });
        var points = [];
        Object.keys(dayMap).forEach(function(day){
            var users = dayMap[day].sort(function(a,b){return (b.totalMonetary||0)-(a.totalMonetary||0)}).slice(0,10);
            users.forEach(function(x){
                points.push([new Date(x.lastOrderDate).getTime(), x.totalMonetary, x.buyerPhone, x.orderFrequency, x.lastOrderDate, x.valueTier]);
            });
        });
        var colors={'高价值':'#e94560','中价值':'#0f3460','低价值':'#ccc'};
        var by={}; points.forEach(function(x){var t=x[5]||'低价值';if(!by[t])by[t]=[];by[t].push(x)});
        sc.setOption({
            tooltip:{formatter:function(p){var v=p.value;return (v[2]||'')+': '+v[4]+' freq='+(v[3]||0)+' amount='+Number(v[1]).toLocaleString()}},
            dataZoom:[{type:'slider',height:24,bottom:8},{type:'inside'}],
            xAxis:{type:'time',name:'最近购买日期'},yAxis:{type:'value',name:'累计消费(元)'},
            series:Object.keys(by).map(function(t){return{name:t,type:'scatter',symbolSize:10,large:true,data:by[t],itemStyle:{color:colors[t]||'#888',opacity:0.5}}})
        }, true);
        ld.style.display = 'none';
        ch.style.display = '';
        var dayCount = Object.keys(dayMap).length;
        document.getElementById('scatterInfo').innerText = dayCount+'天 × 每天Top10 = '+points.length+'个点';
    }, 50);
}

function refresh(){
    try{ document.getElementById('updateTime').innerText='更新: '+new Date().toLocaleTimeString(); }catch(e){}
    try{
        var pie = echarts.getInstanceByDom(document.getElementById('chartPie'));
        if(!pie) pie = echarts.init(document.getElementById('chartPie'));

        fetch('/api/ads/user-value-distribution').then(function(r){return r.json()}).then(function(d){
            pie.setOption({tooltip:{trigger:'item'},series:[{type:'pie',radius:'60%',data:Object.entries(d).map(function(e){return{name:e[0],value:e[1]}})}]}, true);
        });
        fetch('/api/ads/user-value').then(function(r){return r.json()}).then(function(d){
            allUserData = d;
            doFilterScatter();
        });
        // 高价值用户表格 Top20
        fetch('/api/ads/user-value?valueTier='+encodeURIComponent('高价值')).then(function(r){return r.json()}).then(function(d){
            var top=d.slice(0,20),h='';
            top.forEach(function(x,i){
                h+='<tr><td>'+(i+1)+'</td><td>'+x.buyerPhone+'</td><td>'+(x.buyerName||'-')+'</td><td>'+(x.lastOrderDate||'-')+'</td><td>'+x.orderFrequency+'</td><td class="amount">'+Number(x.totalMonetary).toLocaleString()+'</td><td>'+(x.avgOrderAmount?Number(x.avgOrderAmount).toLocaleString():'-')+'</td><td><span class="badge-tier badge-high">'+x.valueTier+'</span></td></tr>';
            });
            if(!top.length) h='<tr><td colspan="8" style="text-align:center;padding:30px;color:#999">暂无高价值用户</td></tr>';
            document.getElementById('topUserBody').innerHTML=h;
        });
    }catch(e){console.log(e)}
}
refresh();
</script>
</body>
</html>
