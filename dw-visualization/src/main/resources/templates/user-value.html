<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>用户价值</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{display:flex;font-family:'Microsoft YaHei',sans-serif}.sidebar{width:200px;min-height:100vh;background:#1a1a2e;color:#eee;flex-shrink:0}.sidebar h4{padding:20px 16px 10px;color:#e94560}.sidebar a{display:block;padding:12px 20px;color:#ccc;text-decoration:none;border-left:3px solid transparent;font-size:14px}.sidebar a:hover,.sidebar a.active{background:#16213e;color:#fff;border-left-color:#e94560}.main{flex:1;padding:20px 30px;background:#f5f6fa;min-height:100vh}.card{border:none;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.06);background:#fff;padding:15px}.card-header{font-weight:bold;padding:0 0 10px}</style></head>
<body>
<div class="sidebar" id="sidebar"></div>
<div class="main"><h5 style="margin-bottom:20px">用户价值分析 (RFM)</h5>
<div style="display:flex;gap:15px">
<div class="card" style="flex:1"><div class="card-header">价值分层</div><div id="chartPie" style="height:320px"></div></div>
<div class="card" style="flex:2"><div class="card-header">RFM散点图 (频率 vs 金额)</div><div id="chartScatter" style="height:320px"></div></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>
document.getElementById('sidebar').innerHTML='<h4>DW可视化</h4>'+['仪表盘','品类营收','销售趋势','用户价值','商品排行','区域销售'].map(function(n,i){var p=['/','/category-revenue','/daily-sales-trend','/user-value','/product-ranking','/regional-sales'][i];return'<a href="'+p+'"'+(location.pathname===p?' class="active"':'')+'>'+n+'</a>'}).join('');
var pie=echarts.init(document.getElementById('chartPie')),sc=echarts.init(document.getElementById('chartScatter'));
fetch('/api/ads/user-value-distribution').then(r=>r.json()).then(d=>{pie.setOption({tooltip:{trigger:'item'},series:[{type:'pie',radius:'60%',data:Object.entries(d).map(([k,v])=>({name:k,value:v}))}]})});
var colors={'高价值':'#e94560','中价值':'#0f3460','低价值':'#ccc'};
fetch('/api/ads/user-value').then(r=>r.json()).then(d=>{var by={};d.forEach(x=>{var t=x.valueTier;if(!by[t])by[t]=[];by[t].push([x.orderFrequency,x.totalMonetary,x.buyerPhone])});sc.setOption({tooltip:{formatter:p=>p.value[2]+': freq='+p.value[0]+' amount='+Number(p.value[1]).toLocaleString()},xAxis:{type:'value',name:'购买频率'},yAxis:{type:'value',name:'累计消费(元)'},series:Object.keys(by).map(function(t){return{name:t,type:'scatter',symbolSize:8,data:by[t],itemStyle:{color:colors[t]||'#888'}}})})});
</script>
</body>
</html>
