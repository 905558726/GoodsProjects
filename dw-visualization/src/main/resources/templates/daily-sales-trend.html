<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>销售趋势</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{display:flex;font-family:'Microsoft YaHei',sans-serif}.sidebar{width:200px;min-height:100vh;background:#1a1a2e;color:#eee;flex-shrink:0}.sidebar h4{padding:20px 16px 10px;color:#e94560}.sidebar a{display:block;padding:12px 20px;color:#ccc;text-decoration:none;border-left:3px solid transparent;font-size:14px}.sidebar a:hover,.sidebar a.active{background:#16213e;color:#fff;border-left-color:#e94560}.main{flex:1;padding:20px 30px;background:#f5f6fa;min-height:100vh}.card{border:none;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.06);background:#fff;padding:15px}</style></head>
<body>
<div class="sidebar" id="sidebar"></div>
<div class="main"><h5>每日销售趋势 <input type="date" id="startDate" style="margin-left:10px;padding:4px 8px"> ~ <input type="date" id="endDate" style="padding:4px 8px"> <button onclick="load()" style="padding:4px 12px;margin-left:8px;cursor:pointer">查询</button></h5>
<div class="card"><div id="chart" style="height:450px"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>
document.getElementById('sidebar').innerHTML='<h4>DW可视化</h4>'+['仪表盘','品类营收','销售趋势','用户价值','商品排行','区域销售'].map(function(n,i){var p=['/','/category-revenue','/daily-sales-trend','/user-value','/product-ranking','/regional-sales'][i];return'<a href="'+p+'"'+(location.pathname===p?' class="active"':'')+'>'+n+'</a>'}).join('');
var c=echarts.init(document.getElementById('chart'));
function load(){var s=document.getElementById('startDate').value,e=document.getElementById('endDate').value,url='/api/ads/daily-sales-trend';if(s)url+='?startDate='+s;if(e)url+=(url.includes('?')?'&':'?')+'endDate='+e;fetch(url).then(r=>r.json()).then(d=>{c.setOption({tooltip:{trigger:'axis'},legend:{data:['销售额','订单数']},xAxis:{type:'category',data:d.map(x=>x.dt)},yAxis:[{type:'value',name:'元'},{type:'value',name:'笔'}],series:[{name:'销售额',type:'line',data:d.map(x=>x.totalSalesAmount),smooth:true,itemStyle:{color:'#e94560'}},{name:'订单数',type:'bar',yAxisIndex:1,data:d.map(x=>x.totalOrderCount),itemStyle:{color:'#0f3460'}}]})})}
load();
</script>
</body>
</html>
