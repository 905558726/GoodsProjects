<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>销售趋势</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{display:flex;font-family:'Microsoft YaHei',sans-serif;background:#f0f2f5}
.sidebar{width:200px;min-height:100vh;background:linear-gradient(180deg,#1a1a2e 0%,#16213e 100%);color:#eee;flex-shrink:0;position:sticky;top:0}
.sidebar h4{padding:24px 20px 16px;color:#e94560;font-size:16px;letter-spacing:1px}
.sidebar a{display:flex;align-items:center;padding:14px 20px;color:#b0b0c0;text-decoration:none;border-left:3px solid transparent;font-size:14px;transition:all .2s}
.sidebar a:hover,.sidebar a.active{background:rgba(233,69,96,.1);color:#fff;border-left-color:#e94560}
.main{flex:1;padding:24px 30px;min-height:100vh}
.card{border:none;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.06);background:#fff;padding:20px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.toolbar input[type=date],.toolbar button{height:34px;border:1px solid #ddd;border-radius:4px;font-size:14px}
.toolbar input[type=date]{padding:4px 8px;min-width:150px}
.toolbar button{background:#e94560;color:#fff;border:none;padding:6px 16px;cursor:pointer;font-weight:bold}
.toolbar button:hover{background:#c73d52}
</style></head>
<body>
<div class="sidebar">
<h4>DW可视化</h4>
<a href="/">仪表盘</a>
<a href="/category-revenue">品类营收</a>
<a href="/daily-sales-trend" class="active">销售趋势</a>
<a href="/user-value">用户价值</a>
<a href="/product-ranking">商品排行</a>
<a href="/regional-sales">区域销售</a>
<a href="/goods-info">商品库</a>
</div>
<div class="main">
<div class="toolbar"><strong style="font-size:16px">每日销售趋势</strong> <input type="date" id="startDate"> <span>~</span> <input type="date" id="endDate"> <button onclick="load()">查询</button> <span id="updateTime" style="font-size:12px;color:#999;margin-left:10px"></span></div>
<div class="card"><div id="chart" style="height:450px"></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>
(function init(){var t=new Date();document.getElementById('endDate').value=t.toISOString().slice(0,10);document.getElementById('startDate').value=new Date(t-90*86400000).toISOString().slice(0,10);load();})();

function load(){
    try{ document.getElementById('updateTime').innerText='更新: '+new Date().toLocaleTimeString(); }catch(e){}
    try{
        var s=document.getElementById('startDate').value,e=document.getElementById('endDate').value;
        fetch('/api/ads/daily-sales-trend?startDate='+(s||'2026-01-01')+'&endDate='+(e||'2099-01-01')).then(function(r){return r.json()}).then(function(d){
            var c = echarts.getInstanceByDom(document.getElementById('chart'));
            if(!c) c = echarts.init(document.getElementById('chart'));
            c.setOption({
                tooltip:{trigger:'axis'},legend:{data:['销售额','订单数']},
                xAxis:{type:'category',data:d.map(function(x){return x.dt})},
                yAxis:[{type:'value',name:'元'},{type:'value',name:'笔'}],
                series:[{name:'销售额',type:'line',data:d.map(function(x){return x.totalSalesAmount}),smooth:true,itemStyle:{color:'#e94560'}},{name:'订单数',type:'bar',yAxisIndex:1,data:d.map(function(x){return x.totalOrderCount}),itemStyle:{color:'#0f3460'}}]
            }, true);
        });
    }catch(e){console.log(e)}
}
setInterval(load, 5000);
</script>
</body>
</html>
