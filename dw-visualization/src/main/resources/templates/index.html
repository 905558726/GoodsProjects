<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><title>电商数据仓库可视化</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:#f0f2f5}
.sidebar{width:200px;min-height:100vh;background:linear-gradient(180deg,#1a1a2e 0%,#16213e 100%);color:#eee;flex-shrink:0;position:sticky;top:0}
.sidebar h4{padding:24px 20px 16px;color:#e94560;font-size:16px;letter-spacing:1px}
.sidebar a{display:flex;align-items:center;padding:14px 20px;color:#b0b0c0;text-decoration:none;border-left:3px solid transparent;font-size:14px;transition:all .2s}
.sidebar a:hover,.sidebar a.active{background:rgba(233,69,96,.1);color:#fff;border-left-color:#e94560}
.main{flex:1;padding:24px 30px;min-height:100vh}
.card{border:none;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:20px;background:#fff}
.card-header{background:#fff;border-bottom:1px solid #eee;font-weight:bold;padding:12px 15px;border-radius:10px 10px 0 0}
.kpi-box{background:#fff;border-radius:10px;padding:20px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.kpi-box .num{font-size:28px;font-weight:bold;color:#e94560}
.kpi-box .label{color:#888;margin-top:5px;font-size:13px}
</style></head>
<body>
<div class="sidebar">
<h4>DW可视化</h4>
<a href="/" class="active">仪表盘</a>
<a href="/category-revenue">品类营收</a>
<a href="/daily-sales-trend">销售趋势</a>
<a href="/user-value">用户价值</a>
<a href="/product-ranking">商品排行</a>
<a href="/regional-sales">区域销售</a>
<a href="/goods-info">商品库</a>
</div>
<div class="main">
<h5 style="margin-bottom:20px">电商数据仓库概览 <span id="updateTime" style="font-size:12px;color:#999;margin-left:10px">加载中...</span></h5>
<div style="display:flex;gap:15px;margin-bottom:20px">
<div class="kpi-box" style="flex:1"><div class="num" id="kpiS">-</div><div class="label">总销售额 (元)</div></div>
<div class="kpi-box" style="flex:1"><div class="num" style="color:#0f3460" id="kpiO">-</div><div class="label">总销量 (件)</div></div>
<div class="kpi-box" style="flex:1"><div class="num" style="color:#16c79a" id="kpiU">-</div><div class="label">活跃用户数</div></div>
<div class="kpi-box" style="flex:1"><div class="num" style="color:#e7b012" id="kpiSk">-</div><div class="label">动销SKU数</div></div>
</div>
<div style="display:flex;gap:15px">
<div class="card" style="flex:1"><div class="card-header">品类营收分布</div><div id="chartPie" style="height:320px"></div></div>
<div class="card" style="flex:1"><div class="card-header">近7天销售趋势</div><div id="chartTrend" style="height:320px"></div></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>
var cpu, ctr;
function getChart(id){var e=document.getElementById(id);if(!e)return null;var c=echarts.getInstanceByDom(e);return c||echarts.init(e);}
function updateTime(){var e=document.getElementById('updateTime');if(e)e.innerText='更新: '+new Date().toLocaleTimeString();}

function loadKPI(){
    fetch('/api/ads/dashboard-kpi').then(function(r){return r.json()}).then(function(d){
        var e=document.getElementById('kpiS');if(e)e.innerText=Number(d.totalSalesAmount||0).toLocaleString();
        e=document.getElementById('kpiO');if(e)e.innerText=d.totalOrderCount||0;
        e=document.getElementById('kpiU');if(e)e.innerText=d.activeUserCount||0;
        e=document.getElementById('kpiSk');if(e)e.innerText=d.activeSkuCount||0;
    });
}

function loadPie(){
    if(!cpu)cpu=getChart('chartPie');if(!cpu)return;
    fetch('/api/ads/category-revenue').then(function(r){return r.json()}).then(function(d){
        cpu.setOption({tooltip:{trigger:'item'},series:[{type:'pie',radius:['40%','70%'],data:d.map(function(x){return{name:x.category,value:x.totalAmount}})}]}, true);
    });
}

function loadTrend(){
    if(!ctr)ctr=getChart('chartTrend');if(!ctr)return;
    var t=new Date().toISOString().slice(0,10),a=new Date(Date.now()-7*86400000).toISOString().slice(0,10);
    fetch('/api/ads/daily-sales-trend?startDate='+a+'&endDate='+t).then(function(r){return r.json()}).then(function(d){
        ctr.setOption({tooltip:{trigger:'axis'},xAxis:{type:'category',data:d.map(function(x){return x.dt})},yAxis:{type:'value'},series:[{type:'line',data:d.map(function(x){return x.totalSalesAmount}),smooth:true,areaStyle:{}}]}, true);
    });
}

// 首次加载
loadKPI();loadPie();loadTrend();updateTime();
// 5秒刷新
setInterval(function(){loadKPI();loadPie();loadTrend();updateTime();},60000);
</script>
</body>
</html>
