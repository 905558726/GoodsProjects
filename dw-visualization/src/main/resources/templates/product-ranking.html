<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>商品排行</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{display:flex;font-family:'Microsoft YaHei',sans-serif;background:#f0f2f5}
.sidebar{width:200px;min-height:100vh;background:linear-gradient(180deg,#1a1a2e 0%,#16213e 100%);color:#eee;flex-shrink:0;position:sticky;top:0}
.sidebar h4{padding:24px 20px 16px;color:#e94560;font-size:16px;letter-spacing:1px}
.sidebar a{display:flex;align-items:center;padding:14px 20px;color:#b0b0c0;text-decoration:none;border-left:3px solid transparent;font-size:14px;transition:all .2s}
.sidebar a:hover,.sidebar a.active{background:rgba(233,69,96,.1);color:#fff;border-left-color:#e94560}
.main{flex:1;padding:24px 30px;min-height:100vh}
.card{border:none;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.06);background:#fff;padding:20px}
select{padding:4px 8px;border:1px solid #ddd;border-radius:4px;font-size:13px}
</style></head>
<body>
<div class="sidebar">
<h4>DW可视化</h4>
<a href="/">仪表盘</a>
<a href="/category-revenue">品类营收</a>
<a href="/daily-sales-trend">销售趋势</a>
<a href="/user-value">用户价值</a>
<a href="/product-ranking" class="active">商品排行</a>
<a href="/regional-sales">区域销售</a>
<a href="/goods-info">商品库</a>
</div>
<div class="main">
<h5 style="margin-bottom:20px">商品热销排行
<select id="catSel" style="margin-left:10px" onchange="load()"><option value="">全部品类</option></select>
<select id="topSel" style="margin-left:8px" onchange="load()"><option value="10">Top10</option><option value="20">Top20</option><option value="50">Top50</option></select>
<span id="updateTime" style="font-size:12px;color:#999;margin-left:10px"></span></h5>
<div class="card"><div id="chart" style="min-height:450px"></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>
var catInitDone = false;

function load(){
    try{ document.getElementById('updateTime').innerText='更新: '+new Date().toLocaleTimeString(); }catch(e){}
    try{
        var cat=document.getElementById('catSel').value,topN=document.getElementById('topSel').value;
        fetch('/api/ads/product-ranking?topN='+topN+(cat?'&category='+encodeURIComponent(cat):'')).then(function(r){return r.json()}).then(function(d){
            var n=d.length||10,h=Math.max(450,n*28),el=document.getElementById('chart');
            el.style.height=h+'px';
            var c = echarts.getInstanceByDom(el);
            if(!c){c=echarts.init(el);}else{c.resize();}
            c.setOption({
                tooltip:{trigger:'axis'},grid:{left:'3%',right:'18%',containLabel:true},
                xAxis:{type:'value'},yAxis:{type:'category',inverse:true,data:d.map(function(x){return x.productName}),axisLabel:{fontSize:12,width:120,overflow:'truncate'}},
                series:[{type:'bar',barWidth:14,data:d.map(function(x,i){return{value:x.totalQuantity,label:{show:true,position:'right',formatter:function(p){return'销量:'+p.value+'|'+d[p.dataIndex].category}}}}),itemStyle:{color:new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#e94560'},{offset:1,color:'#0f3460'}])}}]
            }, true);
        });
    }catch(e){console.log(e)}
}

// 品类下拉初始化
fetch('/api/ads/category-revenue').then(function(r){return r.json()}).then(function(d){
    var s=document.getElementById('catSel');
    d.forEach(function(x){var o=document.createElement('option');o.value=x.category;o.text=x.category;s.appendChild(o)});
    catInitDone=true;
    load();
});

setInterval(load, 5000);
</script>
</body>
</html>
