<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>商品排行</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{display:flex;font-family:'Microsoft YaHei',sans-serif}.sidebar{width:200px;min-height:100vh;background:#1a1a2e;color:#eee;flex-shrink:0}.sidebar h4{padding:20px 16px 10px;color:#e94560}.sidebar a{display:block;padding:12px 20px;color:#ccc;text-decoration:none;border-left:3px solid transparent;font-size:14px}.sidebar a:hover,.sidebar a.active{background:#16213e;color:#fff;border-left-color:#e94560}.main{flex:1;padding:20px 30px;background:#f5f6fa;min-height:100vh}.card{border:none;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.06);background:#fff;padding:15px}</style></head>
<body>
<div class="sidebar" id="sidebar"></div>
<div class="main"><h5 style="margin-bottom:20px">商品热销排行 <select id="catSel" style="margin-left:10px;padding:4px 8px" onchange="load()"><option value="">全部品类</option></select> <select id="topSel" style="padding:4px 8px;margin-left:8px" onchange="load()"><option value="10">Top10</option><option value="20">Top20</option><option value="50">Top50</option></select> <span id="updateTime" style="font-size:12px;color:#999;margin-left:10px"></span></h5>
<div class="card"><div id="chart" style="height:450px"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>
document.getElementById('sidebar').innerHTML='<h4>DW可视化</h4>'+['仪表盘','品类营收','销售趋势','用户价值','商品排行','区域销售','商品库'].map(function(n,i){var p=['/','/category-revenue','/daily-sales-trend','/user-value','/product-ranking','/regional-sales','/goods-info'][i];return'<a href="'+p+'"'+(location.pathname===p?' class="active"':'')+'>'+n+'</a>'}).join('');
var c=echarts.init(document.getElementById('chart'));
function load(){document.getElementById('updateTime').innerText='更新: '+new Date().toLocaleTimeString();var cat=document.getElementById('catSel').value,topN=document.getElementById('topSel').value;fetch('/api/ads/product-ranking?topN='+topN+(cat?'&category='+encodeURIComponent(cat):'')).then(function(r){return r.json()}).then(function(d){c.setOption({tooltip:{trigger:'axis'},grid:{left:'3%',right:'12%',containLabel:true},xAxis:{type:'value'},yAxis:{type:'category',inverse:true,data:d.map(function(x){return x.productName})},series:[{type:'bar',data:d.map(function(x,i){return{value:x.totalQuantity,label:{show:true,position:'right',formatter:function(p){return'销量:'+p.value+'|'+d[p.dataIndex].category}}}}),itemStyle:{color:new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#e94560'},{offset:1,color:'#0f3460'}])}}]})})}
fetch('/api/ads/category-revenue').then(function(r){return r.json()}).then(function(d){var s=document.getElementById('catSel');d.forEach(function(x){var o=document.createElement('option');o.value=x.category;o.text=x.category;s.appendChild(o)});load()});
setInterval(load,5000);
</script>
</body>
</html>
