<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>电商数据仓库可视化</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/extension/bmap.min.js"></script>
    <style>
        body { display: flex; margin: 0; font-family: 'Microsoft YaHei', sans-serif; }
        .sidebar { width: 220px; min-height: 100vh; background: #1a1a2e; color: #eee; flex-shrink: 0; }
        .sidebar h4 { padding: 20px 16px 10px; color: #e94560; }
        .sidebar a { display: block; padding: 12px 20px; color: #ccc; text-decoration: none; border-left: 3px solid transparent; }
        .sidebar a:hover, .sidebar a.active { background: #16213e; color: #fff; border-left-color: #e94560; }
        .main { flex: 1; padding: 20px 30px; background: #f5f6fa; min-height: 100vh; }
        .card { border: none; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.06); margin-bottom: 20px; }
        .card-header { background: #fff; border-bottom: 1px solid #eee; font-weight: bold; font-size: 16px; }
        .kpi-box { background: #fff; border-radius: 10px; padding: 20px; text-align: center; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
        .kpi-box .num { font-size: 28px; font-weight: bold; color: #e94560; }
        .kpi-box .label { color: #888; margin-top: 5px; }
    </style>
</head>
<body>
<div class="sidebar">
    <h4>DW 可视化</h4>
    <a href="/" th:classappend="${#request.requestURI == '/' ? 'active' : ''}">仪表盘</a>
    <a href="/category-revenue" th:classappend="${#strings.startsWith(#request.requestURI, '/category-revenue') ? 'active' : ''}">品类营收</a>
    <a href="/daily-sales-trend" th:classappend="${#strings.startsWith(#request.requestURI, '/daily-sales-trend') ? 'active' : ''}">销售趋势</a>
    <a href="/user-value" th:classappend="${#strings.startsWith(#request.requestURI, '/user-value') ? 'active' : ''}">用户价值</a>
    <a href="/product-ranking" th:classappend="${#strings.startsWith(#request.requestURI, '/product-ranking') ? 'active' : ''}">商品排行</a>
    <a href="/regional-sales" th:classappend="${#strings.startsWith(#request.requestURI, '/regional-sales') ? 'active' : ''}">区域销售</a>
</div>
<div class="main">
    <th:block th:replace="${content} ?: _">content placeholder</th:block>
</div>
</body>
</html>
